# Build APK from the same Vite app as Pages.
name: Release app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: npm install
      - run: npm run build
      - name: Capacitor Android
        run: |
          set -e
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          python3 -c "
          from pathlib import Path
          ver = Path('VERSION').read_text().strip()
          p = Path('android/app/build.gradle')
          t = p.read_text()
          t = t.replace('versionCode 1', 'versionCode 37')
          t = t.replace('versionName \"1.0\"', f'versionName \"{ver}\"')
          p.write_text(t)
          "
      - name: Assemble APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Stage
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/3600-wiring.apk
          ls -lh artifacts/3600-wiring.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wiring-apk
          path: artifacts/3600-wiring.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.30
          name: 3600 Wiring 1.2.30
          body: |
            **[Open the shop-manual](https://thelubemaster.github.io/thomasvista3600/)**

            431-87 19D splices to 19A and crosses DASH CONNECTOR (2) H5 to the fuel heater. Matches the cab trace.

            Android: [3600-wiring.apk](https://thelubemaster.github.io/thomasvista3600/3600-wiring.apk)
          files: artifacts/3600-wiring.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh the website with this APK
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-pages.yml",
              ref: "main",
            });
