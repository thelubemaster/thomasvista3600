# Live preview tracks GitHub main:
# https://thelubemaster.github.io/thomasvista3600/
# One-time: Settings → Pages → Source = GitHub Actions
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site from companion
        run: |
          set -e
          mkdir -p _site
          if [ -f companion/index.html ]; then
            cp companion/index.html _site/index.html
            [ -f companion/data.js ] && cp companion/data.js _site/data.js
            [ -f companion/app.js ] && cp companion/app.js _site/app.js
            [ -d companion/public ] && cp -r companion/public _site/public || true
          elif [ -f index.html ]; then
            cp index.html _site/index.html
          else
            echo '<!DOCTYPE html><html><body><h1>v0.4.1</h1><p>Push companion/</p></body></html>' > _site/index.html
          fi
          ls -la _site
          grep -o 'v[0-9]\.[0-9]\.[0-9]' _site/index.html | head -1 || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
