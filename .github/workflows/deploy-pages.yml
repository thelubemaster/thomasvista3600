# Live app: https://thelubemaster.github.io/thomasvista3600/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Stamp version
        run: |
          VER=$(tr -d ' \n' < VERSION)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '%s\n' "{\"version\":\"${VER}\",\"name\":\"3600 Wiring\",\"builtAt\":\"${NOW}\",\"apkUrl\":\"https://thelubemaster.github.io/thomasvista3600/3600-wiring.apk\",\"notes\":\"Tap the version number to check for an update.\"}" > public/version.json
      - run: npm run build
      - name: Put the APK on the site
        run: |
          set +e
          curl -fL --retry 5 --retry-delay 2 -o dist/3600-wiring.apk \
            "https://github.com/thelubemaster/thomasvista3600/releases/latest/download/3600-wiring.apk"
          if [ ! -s dist/3600-wiring.apk ]; then
            [ -f public/3600-wiring.apk ] && cp public/3600-wiring.apk dist/3600-wiring.apk
          fi
          ls -lh dist | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
