# Live site: https://thelubemaster.github.io/thomasvista3600/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site from companion
        run: |
          set -e
          mkdir -p _site
          cp companion/index.html _site/index.html
          for f in data.js manifest.webmanifest sw.js install.json icon-192.png icon-512.png apple-touch-icon.png 3600-wiring.apk apk.html; do
            [ -f "companion/$f" ] && cp "companion/$f" "_site/$f"
          done
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
